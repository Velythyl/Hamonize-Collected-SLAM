[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "rw-pp-cleanup"
version = "0.1.0"
description = "RGBD dataset cleanup pipeline"
requires-python = "==3.10"
dependencies = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "numpy>=1.23,<2",
    "open3d",
    "pyyaml>=6.0",
    "gtsam>=4.2",
    "tqdm",
    "opencv-python",
]

[project.optional-dependencies]
pointcloud = [
    "open3d>=0.18",
    "opencv-python>=4.8",
]

[project.scripts]
rw-pp = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
include = [
    "main.py",
    "configs/**",
    "docs/**",
]
